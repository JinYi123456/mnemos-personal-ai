# Keep-alive: pings the Render demo every 14 minutes so the free instance
# never sleeps — judges get instant load, no 50-second cold start.
# GitHub Actions gives public repos free scheduled workflows.
# First time: repo → Actions tab → enable the workflow if prompted.
name: keep-alive

on:
  schedule:
    - cron: '*/14 * * * *'   # every 14 minutes (Render sleeps after 15)
  workflow_dispatch: {}       # manual run button

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mnemos health endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 https://mnemos-personal-ai.onrender.com/api/health)
          echo "health=$code"
          test "$code" = "200"
