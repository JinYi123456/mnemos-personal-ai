# Nebius Serverless Jobs — nightly dream
#
# Runs Mnemos's dream consolidation as a scheduled job on Nebius AI Cloud,
# so the sky consolidates even when your laptop sleeps. Pair this with a
# scheduler (Nebius cron trigger / GitHub Actions schedule / any cron) that
# runs `nebius jobs run` daily at 03:30.
#
# Requires: NEBIUS_API_KEY (Token Factory, for Nemotron consolidation calls)
# and a way to persist the vault (mount your volume / push vault.json to
# object storage in your wrapper). See SUBMISSION.md Step H.
name: mnemos-nightly-dream
description: >
  Nightly Dream Engine run for Mnemos: replays memories, consolidates
  insights and skills via NVIDIA Nemotron on Nebius Token Factory, and
  decays what no longer matters.
tasks:
  - id: dream
    image: node:22-slim
    command:
      - node
      - src/nightly-job.js
    env:
      - name: NEBIUS_API_KEY
        value: ${NEBIUS_API_KEY}        # inject from your secrets store
      - name: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
    timeout: 15m
    restartPolicy: never
